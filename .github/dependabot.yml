version: 2
updates:
  # cooldown: a release must be this many days old before Dependabot proposes it, so a
  # compromised version that is pulled within days never reaches a PR.
  - package-ecosystem: "swift"
    directory: "/app"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
