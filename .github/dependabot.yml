version: 2
updates:
  - package-ecosystem: "swift"
    directory: "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # jamf-cli version tracking is handled by .github/workflows/update-jamf-cli-version.yml
