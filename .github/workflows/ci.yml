name: Test

on:
  push:
  pull_request:

jobs:
  swift-app:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # Two-leg toolchain matrix for Liquid Glass adoption. Both legs block.
    #   floor leg  — macOS 15 SDK + Xcode 16.4 (Swift 6.1.x): proves the
    #                macOS 14/15 fallback path (the #available else-branch)
    #                builds, AND is the strict-concurrency floor gate (local
    #                Xcode/Swift 6.3 is more lenient and compiles isolation
    #                errors this leg catches).
    #   glass leg  — macOS 26 SDK + Xcode 26.0.1 (Swift 6.2): proves the
    #                #available(macOS 26, *) glassEffect branch compiles.
    #                Pinned to the LOWEST 26 so glass code can't lean on a
    #                26.2+-only API the deployment floor lacks. The existing
    #                codebase was verified clean on 6.2 before this leg was
    #                made blocking (CI run 27642973607).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode: "16.4"
          - os: macos-26
            xcode: "26.0.1"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # Pin the Xcode bundle (not a standalone Swift via
      # swift-actions/setup-swift) so the toolchain and SDK stay in sync —
      # mixing them produces frontend crashes like the SIGABRT we hit on
      # ZIPFoundation during the first PR-9.5 attempt. The pin also stops
      # runner-image rotation from silently shifting the bundled Swift.
      - name: Pin Xcode ${{ matrix.xcode }}
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1
        with:
          xcode-version: ${{ matrix.xcode }}

      - name: Print Swift version
        run: swift --version

      - name: Build Swift app
        working-directory: app
        run: swift build

      - name: Run Swift tests
        working-directory: app
        run: swift test

  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # shellcheck is pre-installed on ubuntu-latest GitHub-hosted runners.
      # bash mode is the project convention for zsh scripts (shellcheck has no
      # native zsh mode; bash mode catches the vast majority of issues).
      # --severity=error ensures only true errors (not style warnings like
      # SC2155 declare/assign) fail the job, keeping CI green on the existing
      # codebase while blocking new regressions.
      - name: Run shellcheck
        run: |
          shellcheck --shell=bash --severity=error \
            app/build-app.sh \
            app/scripts/release.sh \
            app/scripts/package-dmg.sh \
            app/scripts/notarize-release.sh \
            app/scripts/sign-release.sh \
            scripts/build-release.sh
