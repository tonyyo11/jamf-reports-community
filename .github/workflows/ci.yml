name: Test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # requirements-dev.lock.txt is a uv --universal --generate-hashes lockfile
        # covering Python 3.11+ with multi-platform wheel hashes. pip's
        # --require-hashes mode verifies every downloaded artifact against the
        # recorded hash, preventing silent supply-chain substitution.
        run: pip install --require-hashes -r requirements-dev.lock.txt

      - name: Compile
        run: python3 -c "import py_compile; py_compile.compile('jamf-reports-community.py', doraise=True)"

      - name: Run tests
        run: python3 -m pytest tests -q

  swift-app:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      # Pin Xcode so the runner-image rotation doesn't silently shift the
      # bundled Swift between PRs. Xcode 16.4 ships Swift 6.1.x. Pinning
      # the Xcode bundle (rather than installing a standalone Swift via
      # swift-actions/setup-swift) keeps the toolchain and the SDK in sync
      # — mixing them produces frontend crashes like the SIGABRT we hit on
      # ZIPFoundation during the first PR-9.5 attempt.
      - name: Pin Xcode 16.4
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1
        with:
          xcode-version: "16.4"

      - name: Print Swift version
        run: swift --version

      - name: Build Swift app
        working-directory: app
        run: swift build

      - name: Run Swift tests
        working-directory: app
        run: swift test

  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      # shellcheck is pre-installed on ubuntu-latest GitHub-hosted runners.
      # bash mode is the project convention for zsh scripts (shellcheck has no
      # native zsh mode; bash mode catches the vast majority of issues).
      # --severity=error ensures only true errors (not style warnings like
      # SC2155 declare/assign) fail the job, keeping CI green on the existing
      # codebase while blocking new regressions.
      - name: Run shellcheck
        run: |
          shellcheck --shell=bash --severity=error \
            app/build-app.sh \
            app/scripts/release.sh \
            app/scripts/package-dmg.sh \
            app/scripts/notarize-release.sh \
            app/scripts/sign-release.sh \
            scripts/build-release.sh
