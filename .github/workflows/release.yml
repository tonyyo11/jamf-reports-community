name: Release Bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to package, e.g. v1.0.0"
        required: true
        default: "v0.0.0"

permissions:
  contents: write

jobs:
  build-release:
    name: Build and attach release bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Build bundle
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          fi
          # Validate version string before writing to env or paths.
          # Must match vX.Y.Z with an optional lowercase prerelease suffix
          # (-rc1, -beta2, -alpha1) — the restricted character set still prevents
          # injection via a maliciously-crafted workflow_dispatch input value.
          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)[0-9]+)?$'; then
            echo "✗ Invalid version format: '$VERSION'" >&2
            echo "  Expected: vX.Y.Z or vX.Y.Z-rcN / -betaN / -alphaN" >&2
            exit 1
          fi
          ./scripts/build-release.sh "$VERSION"
          echo "ASSET_PATH=dist/jamf-reports-community-$VERSION.zip" >> "$GITHUB_ENV"
          echo "SUMS_PATH=dist/SHA256SUMS" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: jamf-reports-community-release-${{ github.ref_name || github.event.inputs.version }}
          path: |
            ${{ env.ASSET_PATH }}
            ${{ env.SUMS_PATH }}
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3
        with:
          files: |
            ${{ env.ASSET_PATH }}
            ${{ env.SUMS_PATH }}
          generate_release_notes: true
          # Tags carrying a prerelease suffix (-rc1, -beta2, …) publish as a
          # GitHub prerelease; a bare vX.Y.Z tag publishes as a full release.
          prerelease: ${{ contains(github.ref_name, '-') }}
