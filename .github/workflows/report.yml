name: Generate Jamf Report

on:
  # Run every Monday at 08:00 UTC — adjust to your org's schedule.
  schedule:
    - cron: "0 8 * * 1"

  # Allow manual runs from the Actions tab, with an optional CSV upload path.
  workflow_dispatch:
    inputs:
      csv_path:
        description: "Relative path to a CSV export committed to this repo (leave blank to skip)"
        required: false
        default: ""

jobs:
  generate-report:
    name: Generate report
    runs-on: macos-latest   # macOS runner gives access to jamf-cli via Homebrew
    permissions:
      contents: read

    steps:
      # ------------------------------------------------------------------
      # 1. Check out the repository
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      # ------------------------------------------------------------------
      # 2. Set up Python
      # ------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        # requirements.lock.txt is a uv --universal --generate-hashes lockfile.
        # --require-hashes verifies every downloaded artifact against the
        # recorded hash, preventing silent supply-chain substitution.
        run: pip install --require-hashes -r requirements.lock.txt

      # ------------------------------------------------------------------
      # 3. (Optional) Install jamf-cli via Homebrew.
      #    Remove this step if you're running CSV-only reports or if
      #    jamf-cli is pre-installed on your self-hosted runner.
      # ------------------------------------------------------------------
      - name: Install jamf-cli
        run: brew install jamf-cli
        continue-on-error: true   # non-fatal; script falls back to CSV-only mode

      # ------------------------------------------------------------------
      # 3a. Verify jamf-cli binary integrity before it touches credentials.
      #     Checks that the installed binary is signed by Jamf's Developer ID
      #     (TeamIdentifier 483DWKW443).  Skips cleanly when jamf-cli is
      #     absent (e.g. the install step above failed in CSV-only mode).
      #     This step is NOT continue-on-error — a wrong or tampered binary
      #     must never receive JAMF_CLIENT_SECRET.
      # ------------------------------------------------------------------
      - name: Verify jamf-cli codesign integrity
        run: |
          if ! command -v jamf-cli > /dev/null 2>&1; then
            echo "jamf-cli not installed — skipping codesign check"
            exit 0
          fi
          JAMF_CLI_PATH="$(command -v jamf-cli)"
          echo "Verifying codesign for: $JAMF_CLI_PATH"
          CODESIGN_OUT=$(codesign -dv --verbose=4 "$JAMF_CLI_PATH" 2>&1)
          echo "$CODESIGN_OUT"
          if ! echo "$CODESIGN_OUT" | grep -q "TeamIdentifier=483DWKW443"; then
            echo "✗ jamf-cli TeamIdentifier does not match expected value 483DWKW443" >&2
            exit 1
          fi
          echo "✓ jamf-cli codesign TeamIdentifier verified"

      # ------------------------------------------------------------------
      # 4. Authenticate jamf-cli.
      #    Store your Jamf Pro URL, client ID, and client secret as
      #    repository secrets: JAMF_URL, JAMF_CLIENT_ID, JAMF_CLIENT_SECRET
      #
      #    Remove or skip this step if jamf-cli is not in use.
      # ------------------------------------------------------------------
      - name: Authenticate jamf-cli
        # The `secrets` context is not available in step-level `if:` —
        # referencing it there makes GitHub reject the entire workflow file
        # (a zero-job failed run on every push). Gate inside the script via
        # the env binding instead.
        env:
          JAMF_URL: ${{ secrets.JAMF_URL }}
          JAMF_CLIENT_ID: ${{ secrets.JAMF_CLIENT_ID }}
          JAMF_CLIENT_SECRET: ${{ secrets.JAMF_CLIENT_SECRET }}
        run: |
          if [ -z "$JAMF_URL" ]; then
            echo "JAMF_URL secret not set — skipping jamf-cli auth"
            exit 0
          fi
          jamf-cli pro setup \
            --url "$JAMF_URL" \
            --client-id "$JAMF_CLIENT_ID" \
            --client-secret "$JAMF_CLIENT_SECRET"
        continue-on-error: true   # non-fatal; script continues without jamf-cli data

      # ------------------------------------------------------------------
      # 5. Collect fresh jamf-cli snapshots (skipped if auth failed).
      #    The JSON files are saved to jamf-cli-data/ and used by generate.
      # ------------------------------------------------------------------
      - name: Collect jamf-cli snapshots
        run: python3 jamf-reports-community.py collect
        continue-on-error: true

      # ------------------------------------------------------------------
      # 6. Generate the report.
      #    --csv is optional; omit it for a jamf-cli-only report.
      #    Pass a --notify webhook URL via the TEAMS_WEBHOOK_URL secret to
      #    receive an Adaptive Card summary in Microsoft Teams.
      # ------------------------------------------------------------------
      - name: Generate report
        env:
          CSV_PATH: ${{ github.event.inputs.csv_path || '' }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          ARGS=()
          if [ -n "$CSV_PATH" ]; then ARGS+=(--csv "$CSV_PATH"); fi
          if [ -n "$TEAMS_WEBHOOK_URL" ]; then ARGS+=(--notify "$TEAMS_WEBHOOK_URL"); fi
          python3 jamf-reports-community.py generate "${ARGS[@]}"

      # ------------------------------------------------------------------
      # 7. Upload the Excel report as a workflow artifact.
      #    The artifact is retained for 30 days by default.
      #    IMPORTANT: Generated reports may contain MDM device inventory data
      #    (serial numbers, usernames, compliance status). The retention period
      #    should align with your organisation's data-handling and retention
      #    policy. Adjust retention-days accordingly before deploying this
      #    workflow, and consider whether workflow artifacts are an appropriate
      #    storage tier for your data classification.
      # ------------------------------------------------------------------
      - name: Upload report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: jamf-report-${{ github.run_number }}
          path: "Generated Reports/*.xlsx"
          retention-days: 30
          if-no-files-found: error
