# jamf-reports community edition — example configuration
#
# Copy this file to config.yaml and edit to match your Jamf Pro instance.
# The app creates and edits config.yaml for you: onboarding scaffolds a starter
# config, and the Config screen re-scaffolds against a CSV export to auto-detect
# the column mappings below.
#
# The scaffold reads your actual CSV headers and maps them to the logical field
# names below. You only need to hand-edit fields it could not detect
# automatically.
#
# Column names in this file must exactly match your Jamf Pro CSV headers,
# including capitalization and spaces. The Config screen's Health Audit flags
# any mapping that no longer matches a CSV header. Config Doctor also lists keys
# the app does not read, with the nearest known key, and lines it skipped; the
# Config screen's From config.yaml tab shows them.


# =============================================================================
# COLUMN MAPPING
# =============================================================================
# Maps logical field names (used internally by the report tool) to the actual
# column headers in your Jamf Pro CSV export.
#
# Required fields (marked below) must be present for core functionality.
# Optional fields can be omitted or left blank — those sheets or calculations
# will be skipped gracefully.
#
# Tip: Open your CSV in a spreadsheet app, copy the exact header text, and
# paste it here as the value.

columns:

  # --- Core identity fields (required) ---

  # The computer's display name in Jamf Pro.
  computer_name: "Computer Name"

  # The hardware serial number. Used as a stable unique key across reports.
  serial_number: "Serial Number"

  # The macOS version string as reported by Jamf inventory.
  # Common values: "macOS 15.3.2", "15.3.2", "Sequoia 15.3.2"
  # The tool normalises these automatically.
  operating_system: "Operating System Version"

  # Timestamp of the computer's last Jamf check-in.
  # Accepted formats: "YYYY-MM-DD", "YYYY-MM-DD HH:MM:SS", ISO 8601.
  last_checkin: "Last Check-in"

  # --- User assignment (optional) ---

  # The department the computer is assigned to.
  department: "Department"

  # The manager field (plain name or AD Distinguished Name — both are handled).
  # There is no universal Jamf "Manager" column — it is typically an Extension
  # Attribute, so this is unset by default. Point it at your EA's column name to
  # enable it. Do not point it at Jamf's built-in "Managed"/"Unmanaged" status.
  manager: ""

  # The assigned user's email address.
  email: "Email Address"

  # --- Security controls (optional — each drives a row in Security Controls sheet) ---

  # FileVault 2 encryption status. Prefer the detailed FileVault 2 status column;
  # a count column such as "FileVault Status" ("1/1", "0/1") also works.
  filevault: "FileVault 2 Status"

  # System Integrity Protection status. Typical values: "Enabled", "Disabled".
  sip: "System Integrity Protection"

  # macOS Firewall status. Typical values: "Enabled", "Disabled", "On", "Off".
  firewall: "Firewall Enabled"

  # Gatekeeper status. Typical values: "Enabled", "Disabled", "On", "Off".
  gatekeeper: "Gatekeeper"

  # Secure Boot level. Typical values: "Full Security", "Medium Security", "No Security".
  secure_boot: "Secure Boot Level"

  # Whether a Bootstrap Token is escrowed in Jamf. Prefer the escrowed column over
  # "Bootstrap Token Allowed" when tracking compliance.
  bootstrap_token: "Bootstrap Token Escrowed"

  # Boot volume percentage used. The tool reads this as a plain number (0-100).
  disk_percent_full: "Boot Drive Percentage Full"

  # --- Hardware info (optional) ---

  # security_policy's hardware rule on a CSV needs architecture (Apple silicon) and
  # model_identifier (T2 Macs); without them hardware is unknown and FileVault off keeps the
  # control's own level.

  # Processor architecture, as Jamf exports it. Typical values: "arm64", "x86_64".
  architecture: "Architecture Type"

  # The human-readable model name (e.g., "MacBook Pro (16-inch, 2021)").
  model: "Model"

  # The hardware model identifier (e.g., "Mac16,6", "MacBookPro16,1"). Used with architecture
  # to tell Apple silicon and T2 Macs apart for security_policy.filevault_off_hardware_encrypted.
  model_identifier: "Model Identifier"

  # --- Enrollment / MDM (optional) ---

  # Date the computer was last enrolled in Jamf.
  last_enrollment: "Last Enrollment"

  # MDM configuration profile expiration date.
  # Used with custom_eas type: date to flag expiring/expired profiles.
  mdm_expiry: "MDM Profile Expiration Date"

  # --- Extra inventory columns (optional) ---
  #
  # Each key you map adds one column to the Device Inventory and Stale Devices
  # sheets, in the order listed here. A key left empty adds nothing. The Config
  # screen lists these after the columns above; clearing one there removes its key.

  # The assigned user's full name.
  full_name: ""

  # The computer's asset tag.
  asset_tag: ""

  # The building the computer is assigned to.
  building: ""

  # The assigned user's position or job title.
  position: ""

  # The user who last logged in to the computer.
  last_logged_in_user: ""

  # Recovery Lock status.
  recovery_lock: ""

  # Battery health or condition.
  battery_health: ""

  # Microsoft Entra SSO registration status.
  entra_sso_status: ""

  # Purchase date. Read; no report uses it yet (adds no column).
  # purchase_date: ""


# =============================================================================
# MOBILE CSV COLUMN MAPPING
# =============================================================================
# Used when you want workbook CSV sheets from a mobile-device export instead of
# a computer export. This is separate from `columns` because a computer CSV and
# a mobile CSV use different header schemas.
#
# The first mobile CSV release writes dedicated Mobile Device Inventory and
# Mobile Stale Devices sheets plus custom_eas sheets. Trend charts still remain
# jamf-cli-driven or computer-CSV-driven.

mobile_columns:

  # --- Core identity fields (required for mobile CSV sheets) ---

  # Device display name in the mobile-device export.
  device_name: "Display Name"

  # Hardware serial number.
  serial_number: "Serial Number"

  # iOS / iPadOS / tvOS version string.
  operating_system: "OS Version"

  # Last inventory update / check-in timestamp.
  last_checkin: "Last Inventory Update"

  # --- Useful optional fields ---

  email: "Email Address"
  model: "Model"
  device_family: "Device Family"
  managed: "Managed"
  supervised: "Supervised"


# =============================================================================
# SECURITY AGENTS
# =============================================================================
# Defines which third-party security tools to track.
# Each entry drives a row in the Security Agents sheet.
#
# Required fields per entry:
#   name            - Display label in the report
#   column          - Exact EA column name in your CSV
#   connected_value - The string that means "installed / running"
#                     (case-insensitive substring match)
#
# Comment out any agents your org does not deploy.

security_agents:
  - name: "CrowdStrike Falcon"
    column: "CrowdStrike Falcon - Status"
    # Common EA values: "Installed", "Running", "Healthy", "1"
    connected_value: "Installed"

  - name: "SentinelOne"
    column: "SentinelOne - Agent Status"
    # Common EA values: "running", "Installed", "Active"
    connected_value: "running"

  - name: "Jamf Protect"
    column: "Jamf Protect - Status"
    # Common EA values: "Healthy", "Installed", "Running"
    connected_value: "Healthy"

  - name: "Splunk UF"
    column: "Splunk Universal Forwarder - Status"
    # Common EA values: "Running", "Installed", "Active"
    connected_value: "Running"

  - name: "Nessus Agent"
    column: "Nessus Agent - Status"
    # Common EA values: "running", "Linked", "Installed"
    connected_value: "running"

  - name: "Tanium Client"
    column: "Tanium Client - Version"
    # For Tanium, any non-empty version string means installed.
    # Match the version prefix your org deploys.
    connected_value: "7."

  - name: "Carbon Black"
    column: "Carbon Black Cloud - Sensor Status"
    # Common EA values: "ACTIVE", "Installed", "Running"
    connected_value: "ACTIVE"


# =============================================================================
# JAMF-CLI SNAPSHOTS
# =============================================================================
# jamf-cli is optional. When available, the script can fetch live data and save
# JSON snapshots here. When live auth is unavailable, the script can also reuse
# the newest saved snapshot for each supported sheet.
#
# This lets you keep the simple community default ("jamf-cli-data" next to the
# script) or point at an existing cache such as "Jamf Reports/jamf-cli-data".
# Relative paths here resolve from the folder containing config.yaml.

jamf_cli:
  # Currently has no effect: collect and generate always use jamf-cli, and
  # false does not make a CSV-only run.
  enabled: true
  # Directory where jamf-cli JSON snapshots are stored.
  data_dir: "jamf-cli-data"
  # Optional jamf-cli profile name, equivalent to passing -p/--profile to
  # jamf-cli. When you use multiple profiles, point data_dir at a profile-
  # specific folder so cached snapshots do not mix between tenants.
  profile: ""

  # Reuse the latest saved JSON snapshot when a live jamf-cli command fails.
  # This helps generate/check keep working from cached report data, but
  # inventory-csv still requires live jamf-cli auth.
  use_cached_data: true
  # Age limit (hours) past which a cached snapshot is treated as ABSENT rather
  # than served as if current. Default 168 (7 days): a kind whose newest
  # snapshot is older than this is skipped with a warning naming its age, so an
  # ancient cache surfaces as "no data" instead of rendering stale-forever.
  # Set 0 (or any value <= 0) to keep cache forever (legacy behavior).
  max_cache_age_hours: 168
  # Currently has no effect: nothing reads this key.
  allow_live_overview: true
  # Hard-fail on snapshot integrity violations (SHA-256 mismatch or corrupt
  # manifest). When true, every collected snapshot is also recorded in a
  # per-kind manifest.json (2.6), so tamper detection works end-to-end:
  # generate aborts on .mismatch/.corrupt; legacy snapshots with no manifest
  # (.absent/.omitted) are tolerated. AuditView surfaces verify results
  # regardless of this setting. Threat-model T-11.
  require_manifest: false
  # Report types collect never runs — a stall guard for on-prem Jamf Pro. Accepts
  # any of patch-device-failures, profile-status, update-status and
  # update-device-failures, the per-device-heavy queries known to stall an
  # on-prem server, and dashboard, jamf-cli's HTML fleet dashboard (1.31.0+),
  # which reads the whole inventory again for the HTML report's dashboard
  # section; underscores and hyphens are interchangeable. Anything else is
  # ignored, so core inventory always runs. A listed source is skipped even by a
  # manual collect and is left out of the data freshness strip.
  # Example: collect_skip: [update-status, update-device-failures]
  collect_skip: []


# ---------------------------------------------------------------------------
# Workbook sheet selection (optional)
# ---------------------------------------------------------------------------
sheets:
  # only, skip and order apply to every report workbook: the Jamf Pro tabs,
  # the CSV tabs (custom EA tabs included), the Charts tab, and the tabs of a
  # Jamf School workbook. The period and fleet workbooks do not read them.
  # The report template picks its sheets first; these lists work on what it
  # picked, so only never adds a sheet the template left out. Names match the
  # tab label, case-insensitively, and a name that matches no tab is ignored.

  # When non-empty, only the named workbook tabs are written, the Charts tab
  # included: list "Charts" to keep it. A tab named in both only and skip is
  # not written: skip is applied first. An only list that names no tab of the
  # workbook is ignored as a whole, with a warning in the run log, so a typo
  # never leaves a workbook empty.
  #
  # Example:
  #   only:
  #     - "Patch Compliance"
  #     - "Patch Failures"
  only: []

  # Tabs left out of the workbook.
  #
  # Example:
  #   skip:
  #     - "Update Status"
  #     - "Update Failures"
  skip: []

  # Tab order. The tabs named here come first, in this order, wherever they
  # come from (a CSV tab can go ahead of the Jamf Pro tabs); every other tab
  # follows in its default order. only and skip still apply, so a skipped
  # tab stays out.
  #
  # Example:
  #   order:
  #     - "Fleet Overview"
  #     - "Patch Compliance"
  order: []


# ---------------------------------------------------------------------------
# Organisational branding (all fields optional)
# ---------------------------------------------------------------------------
branding:
  # Your organisation's name. When set, it is prepended to every sheet title
  # in the Excel workbook (e.g. "Acme Corp — Fleet Overview") and shown in
  # the HTML report header.
  org_name: ""

  # Path to a PNG logo file. Only the workbook built from a Jamf Pro CSV export
  # uses it: the logo is placed at the top left of each of that workbook's
  # sheets. A relative path resolves from the folder the app or command runs
  # in, not from this file, so write an absolute path. Other image formats are
  # skipped with a warning; the HTML report shows no logo.
  logo_path: ""

  # Hex colour used for Excel column headers and the HTML report's primary
  # accent colour (topbar, links, stat-card values).  Default: #2D5EA2
  # Write it as #RRGGBB or #RGB; both reports use the default for anything else.
  accent_color: "#2D5EA2"

  # This key currently has no effect: no report reads it. The Config screen
  # still edits it.  Default: #004165
  accent_dark:  "#004165"


# =============================================================================
# HTML REPORT
# =============================================================================
# When track_history is true, every `html` run appends an OS-version snapshot
# to the history file.  Once two or more snapshots exist for an instance URL, a
# macOS Adoption Timeline chart appears in the HTML report.
#
# history_file: path to the JSON file that persists snapshots across runs.
#   Relative paths resolve from this config file's directory and must stay
#   inside it. An absolute path outside the workspace needs
#   output.allow_absolute_paths: true; system and credentials folders are never
#   used. Default (when blank or refused): html_history.json beside the report.
#
html:
  track_history: false
  history_file: ""

  # Display caps for the Jamf Protect sections of the HTML report. A value
  # outside its range is clamped to it, with a warning in the log.
  section_limits:
    # Most alerts the Protect Alerts section lists, highest severity first.
    # Range 1-200.
    protect_alerts: 25
    # Number of recent Protect insight snapshots the Insights Drift section
    # compares, one column each. Range 1-12.
    insights_drift_snapshots: 2


# =============================================================================
# JAMF PROTECT
# =============================================================================
# Optional Jamf Protect data, collected after each Jamf Pro collect that runs:
#   - jamf-cli protect overview
#   - jamf-cli protect alerts list
#   - jamf-cli protect computers list
#   - jamf-cli protect insights list
#   - jamf-cli protect plans list
# Snapshots live under jamf_cli.data_dir with the rest, and the workbook gets a
# Protect Overview, Alerts, Computers, Insights and Plans sheet for each one that
# landed.
#
# Protect has its own jamf-cli profile and setup flow, which the app runs when
# you connect Protect from onboarding or the Data Sources screen:
#
#   jamf-cli protect setup

protect:
  # Set true to collect Jamf Protect data after each Jamf Pro collect.
  enabled: false
  # jamf-cli protect profile name; empty = jamf-cli's default Protect profile.
  # Distinct from jamf_cli.profile (the Pro profile).
  profile: ""


# =============================================================================
# WEBHOOK NOTIFICATIONS (opt-in)
# =============================================================================
# Post a short "report generated" digest to a Microsoft Teams or Slack incoming
# webhook after a scheduled run. OFF by default — set enabled: true and supply a
# provider + https URL. Never commit a real webhook URL.
notify:
  enabled: false
  provider: "teams"   # teams | slack
  url: ""             # https:// incoming webhook URL
  # Payload verbosity: "full" (default) includes metric names/values, error
  # text, and schedule names in cards; "minimal" sends event facts only
  # ("2 alert rules tripped", "run failed", "1 schedule overdue" — no values,
  # no free text). Use minimal for headless/high-security deployments where
  # the webhook is a doorbell, not a data channel. Any other value sends minimal.
  detail: "full"      # full | minimal

# =============================================================================
# METRIC ALERTS (opt-in threshold alerting)
# =============================================================================
# After a scheduled run collects fresh data, evaluate these rules against the
# day's summary and post ONE attention card to the notify: webhook above if any
# rule trips. OFF by default; requires notify: to be enabled with an https URL
# (alerts add no webhook of their own). A rule whose metric has no data that day
# never fires — absent data is not an alert.
#
# metric — one of:
#   filevault_pct, compliance_pct, os_current_pct, patch_pct, sip_pct,
#   firewall_pct, gatekeeper_pct, secure_boot_pct, bootstrap_pct, xprotect_pct,
#   cve_pct, mscp_score_pct, security_score   (all 0–100 percentages/scores)
#   stale_count, action_items_p0, total_devices   (whole-number counts)
# when — one of:
#   below            fires when the value is below threshold
#   above            fires when the value is above threshold
#   drops_more_than  fires when the value fell by more than threshold vs a prior
#                    summary (percentage points for %-metrics); needs history
# threshold — the number to compare against (a positive drop for drops_more_than)
# lookback_days — how far back drops_more_than looks for the prior summary
#                 (default 7; ignored by below/above)
#
# Alerts are evaluated only on schedule modes that COLLECT fresh data
# (snapshot-only, jamf-cli-full, csv-assisted) — a jamf-cli-only schedule
# generates from cache and never evaluates alerts.
#
# A rule with an unknown metric or 'when', or a missing/invalid threshold, is
# ignored rather than failing the whole config — it also shows as a warning in
# the in-app Config Doctor.
alerts:
  enabled: false
  rules: []
  # rules:
  #   - {metric: "filevault_pct", when: "below", threshold: 90}
  #   - {metric: "patch_pct", when: "drops_more_than", threshold: 5, lookback_days: 7}
  #   - {metric: "stale_count", when: "above", threshold: 50}

# =============================================================================
# SECURITY POLICY — what counts as a security gap, for every screen, report and
# scheduled run of this workspace. fail (default): a gap — action items, the
# per-device gap count, risk points and the score, shown red. warning: shown
# amber, not a gap, does not lower the score. ignore: not evaluated; its score
# weight is dropped. Percentages (FileVault on, SIP on, ...) are facts and never
# change. Omit the block, or any key, for the default.
# =============================================================================
security_policy:
  controls:
    filevault: fail      # fail | warning | ignore
    sip: fail
    firewall: fail
    gatekeeper: fail
  # Also read: failure/gap = fail, warn = warning, ignored/skip/not counted = ignore.
  # FileVault off on a Mac whose internal volume is hardware-encrypted (Apple
  # silicon, or Intel with the T2 chip). Omit to use the filevault level.
  # filevault_off_hardware_encrypted: warning
  # Security Score weights, 0-100 each. Omit for these defaults.
  # score_weights:
  #   filevault: 15
  #   sip: 15
  #   firewall: 15
  #   edr_agent: 10
  #   mscp: 20
  #   xprotect: 5
  #   cve: 15
  #   secure_boot: 5

# =============================================================================
# SNAPSHOT RETENTION (admin-controlled; OFF by default)
# =============================================================================
# Raw jamf-cli snapshots under jamf-cli-data/ are a reporting input (per-device
# day-over-day / week-over-week history, especially mSCP) — not just disk cost.
# By default NOTHING is ever removed, so the full raw history stays available
# (ideal when ~/Jamf-Reports lives on cloud/SharePoint storage). Turn this on
# only if you want the app to manage disk for you.
#
# mode: "archive" MOVES old snapshots to the archive folder (still on disk — you
# decide whether to trash them); "delete" removes them. Summaries (the durable
# trend source) are never touched unless include_summaries is true.
retention:
  enabled: false             # OFF — keep everything
  mode: "archive"            # archive | delete
  snapshot_keep_days: 365    # archive/delete raw snapshots older than this (<=0 = no age rule)
  snapshot_keep_count: 0     # always keep at least N newest per kind (0 = no count floor)
  include_summaries: false   # leave the trend summaries alone
  archive_dir: ""            # default: <workspace>/_archive (distinct from output.archive_dir); outside the workspace needs output.allow_absolute_paths

# =============================================================================
# SHARED WORKSPACE (multi-Mac coordination; auto-detected)
# =============================================================================
# Point several Macs at one workspace on a shared folder — OneDrive/SharePoint,
# Box, Dropbox, or a mounted share — and they build a single pooled history
# instead of one per machine. Choose the folder in Settings > Workspace
# location; that path is per-Mac (a sync provider mounts the same folder under
# each user's home), which is why it is NOT a key here. What every machine must
# agree on lives below.
#
# enabled: omit for auto — coordination turns itself on when the workspace is on
#   a synced volume. Set true to force it on for a share the app does not
#   recognise as one, or false for a folder that only looks shared.
#
# Two guards run when it is on:
#   * a scheduled collect stands down if another Mac collected inside
#     min_collect_interval_hours (Refresh in the app always collects anyway)
#   * each run publishes a short claim, so a second machine can see one is
#     already working and wait for its turn
#
# The claim is advisory, not a lock: sync is eventual, so two machines starting
# within seconds of each other can both proceed. Nothing is corrupted when they
# do — snapshots are written under unique timestamped names and read back in
# filename order — you just get two collects instead of one.
#
# Run Check on the Config screen reports which Macs share the folder, when each
# last collected, and whether their clocks and app versions agree.
#
# shared_workspace:
#   enabled: true                  # omit to decide from the folder itself
#   claim_ttl_minutes: 45          # how long a run's claim stays valid (5–720)
#   min_collect_interval_hours: 12 # 0 disables the freshness check entirely

# =============================================================================
# AI INSIGHTS (macOS 27+; opt-in; OFF by default)
# =============================================================================
# Turn already-collected fleet data (the daily summary) into plain-language
# insight cards on the Overview, Trends, Audit, Security Posture and Compliance
# Posture screens, using Apple's on-device Foundation Model. OFF by default and
# inert on any macOS below 27 — set enabled: true to opt in per profile.
#
# Apple Foundation Models is on-device only, so tier: "on_device" is the
#   default and the only behaviour — no fleet data leaves the Mac, and there is
#   nothing to configure to keep it that way.
# A config still naming a removed tier ("pcc" or "external"), or carrying a stale
#   lock_on_device key or external: block, keeps working: the tier falls back to
#   on_device and the dead keys are ignored. The next Settings save drops them.
ai:
  enabled: false            # opt-in; inert on macOS < 27
  tier: "on_device"         # on_device (the only tier)
  reasoning_level: "light"  # light | moderate | deep

# =============================================================================
# JAMF PLATFORM API
# =============================================================================
# Reports only the Jamf Platform API serves, collected through
# `jamf-cli pro report`:
#   - blueprint-status
#   - compliance-rules
#   - compliance-devices
#   - ddm-status
#
# Collect runs them when the profile's jamf-cli auth method is `platform`:
#   jamf-cli config add-profile <name> --auth-method platform \
#     --url https://<region>.api.jamfcloud.com --environment-id <id>
# A tenant-level profile (--tenant-id) skips compliance-rules, compliance-devices
# and blueprint-status, which Jamf Account does not grant at that level. The
# Compliance Benchmarks and DDM Blueprints screens are also behind Settings →
# Experimental Features → Platform API.
#
# Leave compliance_benchmarks empty to collect every benchmark on the tenant, or
# list titles to collect only those. Titles match exactly and are case-sensitive
# (benchmark IDs do not match); a title shared by two benchmarks is skipped. If
# none of the listed titles is on the tenant, both compliance sources fail with
# that cause in Run History and keep their last data. Results land in one Compliance
# Rules sheet and one Compliance Devices sheet with a Benchmark column, and the
# Compliance Benchmarks screen shows one benchmark at a time.

platform:
  # Written by the Config screen's "Enable Platform API sheets" switch. Neither
  # collect nor the reports read it: the profile's auth method decides.
  enabled: false
  # List of benchmark titles for the Platform compliance sheets.
  # Empty collects every benchmark; listed titles narrow it (exact, case-sensitive).
  compliance_benchmarks:
    # - "NIST 800-53r5 Moderate"
    # - "DISA STIG"


# =============================================================================
# COMPLIANCE
# =============================================================================
# Tracks mSCP (macOS Security Compliance Project) audit results or any other
# compliance framework your org reports on.
#
# The mSCP EA scripts write a failed-rules count and a pipe-delimited list of
# failed rule IDs to two separate EAs. Configure both below.
#
# Set enabled: false to skip the Compliance sheet entirely.

compliance:
  enabled: true
  baseline_label: "mSCP Compliance"
  # The framework your compliance results are reported against. The Compliance
  # Posture sheet shows it as typed ("Framework: ..."). The heading of the HTML
  # report's Exception List writes a recognised name in this form, matched
  # case-insensitively (short forms such as "stig" or "cis-l1" also match), and
  # any other text as typed:
  #   "NIST 800-53r5 Moderate", "NIST 800-53r5 High", "DISA STIG macOS",
  #   "CIS Level 1", "CIS Level 2", "CMMC Level 2", "FedRAMP Moderate", "Custom"
  # Empty names no framework.
  framework: ""
  # EA column containing the integer count of failed rules.
  # Used as the single-baseline shorthand when `baselines` is absent.
  failures_count_column: "Compliance - Failed mSCP Results Count - NIST 800-53r5"
  # EA column containing the pipe-delimited list of failed rule IDs.
  # Example cell value: "os_filevault_enable|os_screensaver_timeout|..."
  failures_list_column: "Compliance - Failed mSCP Result List - NIST 800-53r5"

  # Per-baseline list for multi-baseline mSCP/STIG tracking.
  # When present, drives real per-device compliance banding from ea-results
  # instead of the 4-control security-report proxy.
  #
  # The first entry is the "primary" baseline: its Pass % surfaces in the daily
  # summary, the Compliance Benchmark trend chart, and the Stability Index.
  # Every entry gets its own compliance-band donut and Trends band series;
  # a baseline picker appears on the Trends band charts when more than one is set.
  #
  # failures_count_column must match the `ea_name` field in your ea-results
  # snapshot exactly (case-insensitive match at query time).
  #
  # When `baselines` is empty, the engine synthesizes a single baseline from
  # failures_count_column + baseline_label above — no migration needed.
  baselines: []
  # Example multi-baseline configuration (uncomment and edit to enable):
  # Per entry:
  #   rule_count           - optional; total rules in the baseline. When set, a
  #                          failure count above it is rejected as a garbage EA
  #                          value (No Data) instead of banding the device High.
  #   failures_list_column - optional; the pipe-delimited failed-rule-ID EA.
  #                          Enables the count-vs-list accuracy cross-check.
  # baselines:
  #   - name: "NIST 800-53r5"
  #     failures_count_column: "Compliance - Failed mSCP Results Count - NIST 800-53r5 Audit"
  #     failures_list_column: "Compliance - Failed mSCP Result List - NIST 800-53r5 Audit"
  #     rule_count: 315
  #   - name: "DISA STIG"
  #     failures_count_column: "Compliance - Failed mSCP Results Count - DISA STIG"
  #     failures_list_column: "Compliance - Failed mSCP Result List - DISA STIG"
  #     rule_count: 280


# =============================================================================
# COMPLIANCE EXCEPTIONS
# =============================================================================
# Documented waivers for the HTML report's Exception List section, headed with
# compliance.framework above. Each entry needs id, description, signed_off_by and
# signed_off_date, all shown as written; an entry missing one stops config.yaml
# loading. expires_date and linked_finding are optional, and an expires_date in
# yyyy-MM-dd form that has passed shows an "Expired" pill on its row.
#
# With no entries the Exception List falls back to a table of the custom_eas
# below and a hint to add this block; with neither, it says none are configured.

exceptions: []
# exceptions:
#   - id: "EXC-001"
#     description: "Lab Macs stay on the previous macOS for a vendor tool"
#     signed_off_by: "Security Officer"
#     signed_off_date: "2026-01-15"
#     expires_date: "2026-07-15"
#     linked_finding: "os_version_current"
#     control_id: "AC-2"   # read; no report uses it yet


# =============================================================================
# CUSTOM EA SHEETS
# =============================================================================
# Define extra spreadsheet tabs driven entirely by EA data from your CSV.
# Each list entry creates one sheet in the output workbook.
#
# Required fields for every entry:
#   name    - Sheet tab label and section heading in the report
#   column  - Exact EA column name in your CSV
#   type    - One of: boolean, percentage, version, text, date
#
# Supported EA types:
#
#   boolean     - Values like Yes/No, True/False, Enabled/Disabled.
#                 Generates a summary table. Set true_value to the string
#                 that means "compliant".
#
#   percentage  - Numeric values 0-100. Flags devices above warning_threshold
#                 and critical_threshold. Generates a distribution table.
#
#   version     - Version strings (e.g., "15.3.2", "10.0.1").
#                 Generates a version frequency table. Set current_versions
#                 to a list of known-current versions for status coloring.
#
#   text        - Free-form strings. Generates a frequency table.
#                 Useful for agent status values, account names, etc.
#
#   date        - Date strings. Flags devices where the date is past (expired)
#                 or within warning_days days (expiring soon).
#                 Useful for certificate expiration, profile expiration.

custom_eas:

  # --- FileVault encryption status ---
  - name: "FileVault Status"
    column: "FileVault 2 - Status"
    type: boolean
    # Value in this EA that means "compliant / enabled"
    true_value: "Encrypted"

  # --- Disk usage (% used) ---
  - name: "Disk Usage"
    column: "Boot Drive Percentage Full"
    type: percentage
    # Devices above warning_threshold are flagged yellow; above critical_threshold, red.
    warning_threshold: 80
    critical_threshold: 90

  # --- macOS version compliance ---
  - name: "macOS Version"
    column: "Operating System Version"
    type: version
    # List the version strings considered current in your org.
    # Devices on any other version are flagged in the output.
    current_versions:
      - "15.4"
      - "15.3.2"

  # --- Secure Token status ---
  - name: "Secure Token"
    column: "Secure Token - Status"
    type: boolean
    true_value: "Enabled"

  # --- MDM configuration profile expiration ---
  - name: "MDM Profile Expiration"
    column: "MDM Profile Expiration Date"
    type: date
    # Devices with an expiration date within this many days are flagged "expiring soon".
    # Falls back to thresholds.cert_warning_days if not set here.
    warning_days: 30

  # --- Identity certificate expiration ---
  - name: "Identity Certificate Expiration"
    column: "Identity Certificate - Expiration Date"
    type: date
    warning_days: 60

  # --- Patch management agent status ---
  - name: "Patch Agent Status"
    column: "Patch Management - Agent Status"
    type: text


# =============================================================================
# THRESHOLDS
# =============================================================================
# Global numeric thresholds used as defaults across multiple sheets.
# Per-EA thresholds (like warning_threshold in custom_eas above) override
# these defaults when both are set.

thresholds:

  # Devices not checked in within this many days are treated as inactive
  # and excluded from compliance/security agent counts.
  #
  # Also bounds how old a dropped csv-inbox/ export may be before the Devices
  # and Outreach screens stop treating it as current inventory: a CSV cannot
  # report a check-in newer than the day it ran, so past this age it reports
  # live devices as stale and re-adds retired ones. Raise it if you deliberately
  # report over a longer window.
  stale_device_days: 30

  # Currently has no effect: nothing reads this key. The Check-in Health sheet
  # uses stale_device_days.
  checkin_overdue_days: 7

  # Default disk usage thresholds used when not set per-EA.
  warning_disk_percent: 80
  critical_disk_percent: 90

  # Default certificate/date expiry warning window (days).
  cert_warning_days: 90

  # Error count thresholds for the jamf-cli Profile Status sheet. Rows with
  # error counts at or above profile_error_warning are highlighted yellow.
  # profile_error_critical currently has no effect: nothing reads it.
  profile_error_critical: 50
  profile_error_warning: 10


# =============================================================================
# OUTPUT
# =============================================================================

output:

  # Directory where report files are written. Relative paths resolve from the
  # folder containing config.yaml. Created automatically if it does not exist.
  # A leading ~ is expanded. A folder the app will not use (outside the workspace
  # without allow_absolute_paths, or a system folder) is named in the run log and
  # reports go to "Generated Reports" in the workspace.
  output_dir: "Generated Reports"

  # Append a local date/time stamp to generated filenames unless they already
  # contain one.
  timestamp_outputs: true

  # Automatically move older generated runs out of the main output folder.
  archive_enabled: true

  # Optional archive directory for older generated reports and inventory CSVs.
  # Leave blank to use an "archive" folder next to the active output file.
  archive_dir: ""

  # Number of recent timestamped runs to keep in the main output folder for
  # each report family before older runs are moved into archive_dir. A value
  # below 1 is read as 1.
  keep_latest_runs: 10

  # Allow output_dir / archive_dir (and retention.archive_dir) to point OUTSIDE
  # the workspace.
  #
  # Off by default: an absolute path outside the workspace is refused, which
  # keeps every generated file under a directory this app controls. Turn it on
  # to publish reports somewhere else -- most usefully a cloud-synced team
  # folder, so colleagues can read the output without being given the raw
  # fleet data:
  #
  #   allow_absolute_paths: true
  #   output_dir: "~/Library/CloudStorage/OneDrive-Contoso/Team/Jamf Reports"
  #
  # Publish that way rather than relocating the whole workspace. Keeping
  # snapshots, run logs, backups and this file on local disk is what makes the
  # app's file permissions, snapshot ordering and backup retention meaningful --
  # see docs/wiki/10-Security-and-Operational-Considerations.md, and run the
  # Config Doctor (Health Audit -> Config) to see which layout is in effect.
  #
  # Sensitive locations (/etc, /System, ~/.ssh, the rest of ~/Library, ...) stay
  # refused even with this enabled.
  #
  # true, yes, on and 1 all opt in; write true.
  allow_absolute_paths: false


# =============================================================================
# CHARTS
# =============================================================================
# Controls PNG chart generation and embedding in the xlsx workbook. Charts are
# rendered natively by the app — no extra dependencies required.
#
# Charts are embedded in a "Charts" sheet in the workbook AND saved as
# standalone PNG files alongside the xlsx. PNG filenames use the workbook stem
# as a prefix, so each run stays grouped together.
#
# Trend charts read dated CSV snapshots from historical_csv_dir or --historical-csv-dir.
# Snapshot filenames should contain YYYY-MM-DD, YYYYMMDD, YYYY-MM-DD_HHMMSS,
# or YYYY-MM-DDTHHMMSS somewhere in the filename.

charts:

  # Set to false to disable all chart generation.
  enabled: true

  # Save charts as PNG files alongside the xlsx report.
  save_png: true

  # Embed all generated charts into a "Charts" sheet in the workbook.
  embed_in_xlsx: true

  # Optional directory of dated CSV snapshots used for trend charts.
  # Relative paths resolve from the folder containing config.yaml.
  # Best practice: keep one baseline computer inventory export (and optionally
  # one baseline mobile inventory export) per cadence. If a single folder mixes
  # equivalent exports like "Portal - Applications" and "Insights - All Devices",
  # trend charts keep the largest same-day snapshot for that schema and ignore
  # smaller duplicate candidates.
  historical_csv_dir: "snapshots"

  # When true, generate automatically copies the current --csv into
  # historical_csv_dir using a date/time-stamped filename.
  # Re-running generate with the same unchanged CSV reuses the existing
  # identical snapshot instead of copying another duplicate.
  archive_current_csv: true

  # macOS adoption charts: device counts per OS version over time.
  # Uses CSV snapshots when available and falls back to jamf-cli
  # inventory-summary snapshot history for jamf-cli-only workflows.
  os_adoption:
    # Currently has no effect: nothing reads this key.
    enabled: true
    # Also generate one chart per major macOS version (drilldown to minor/patch).
    per_major_charts: true

  # Compliance trend: stacked area chart bucketing devices by failure count.
  # Requires compliance.failures_count_column to be configured.
  compliance_trend:
    # Currently has no effect: nothing reads this key. Only the bands below are read.
    enabled: true
    # Failure count bands — labels, thresholds, and colors.
    bands:
      - {label: "Pass",            min_failures: 0,  max_failures: 0,    color: "#4472C4"}
      - {label: "Low (1-10)",      min_failures: 1,  max_failures: 10,   color: "#2E9E7D"}
      - {label: "Med-Low (11-30)", min_failures: 11, max_failures: 30,   color: "#FFCA30"}
      - {label: "Medium (31-50)",  min_failures: 31, max_failures: 50,   color: "#F07C21"}
      - {label: "High (>50)",      min_failures: 51, max_failures: 9999, color: "#C0392B"}

  # jamf-cli-only trend: managed/unmanaged and current/stale device counts
  # over time from cached device-compliance snapshots.
  device_state_trend:
    enabled: true


# =============================================================================
# JAMF SCHOOL (optional — requires jamf-cli school setup)
# =============================================================================
# Configure this section to generate Jamf School reports.
#
# Setup:
#   1. Connect a Jamf School profile from the app (onboarding, or the Data
#      Sources screen). The app runs `jamf-cli school setup` and sets the fields
#      below.
#   2. Collect, then generate a Jamf School report from the app. Its sheets come
#      from the collected School data; a CSV export alone adds none.

school_cli:
  # Set true to collect with live jamf-cli school commands. School snapshots
  # are stored under jamf_cli.data_dir with the rest.
  enabled: false
  # Profile name configured via: jamf-cli school setup --profile-name <name>
  profile: "school"
